<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shuka — Armenia Marketplace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface-subtle: #f1f5f9;
      --text: #0f172a;
      --text-secondary: #475569;
      --muted: #64748b;
      --border: #e2e8f0;
      --border-strong: #cbd5e1;
      --brand: #0f766e;
      --brand-hover: #115e59;
      --brand-soft: #f0fdfa;
      --accent: #d97706;
      --accent-soft: #fffbeb;
      --danger: #dc2626;
      --danger-soft: #fef2f2;
      --success: #15803d;
      --success-soft: #f0fdf4;
      --shadow-xs: 0 1px 2px rgba(15, 23, 42, 0.04);
      --shadow-sm: 0 4px 12px rgba(15, 23, 42, 0.05);
      --shadow-md: 0 12px 28px rgba(15, 23, 42, 0.08);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-pill: 999px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
    }

    /* Header & Navigation */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 60;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      box-shadow: var(--shadow-xs);
    }

    .header-container {
      max-width: 1240px;
      margin: 0 auto;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .brand-logo {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      text-decoration: none;
      color: var(--text);
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--brand) 0%, #0d9488 100%);
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.05rem;
      font-weight: 800;
      box-shadow: 0 4px 10px rgba(15, 118, 110, 0.25);
    }

    .brand-logo span.tld {
      color: var(--brand);
      font-weight: 700;
    }

    .search-form {
      flex: 1;
      min-width: 240px;
      max-width: 560px;
      display: flex;
      align-items: center;
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      border-radius: var(--radius-pill);
      padding: 4px 4px 4px 16px;
      transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
    }

    .search-form:focus-within {
      background: var(--surface);
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.14);
    }

    .search-form input {
      flex: 1;
      border: none;
      background: transparent;
      font-size: 0.92rem;
      color: var(--text);
      outline: none;
      min-width: 0;
    }

    .search-form button {
      background: var(--brand);
      color: #fff;
      border: none;
      border-radius: var(--radius-pill);
      padding: 8px 18px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    .search-form button:hover {
      background: var(--brand-hover);
    }

    .nav-group {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .nav-link, .nav-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      border-radius: var(--radius-sm);
      font-size: 0.88rem;
      font-weight: 500;
      text-decoration: none;
      color: var(--text-secondary);
      background: transparent;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .nav-link:hover, .nav-btn:hover {
      color: var(--text);
      background: var(--surface-subtle);
    }

    .nav-pill-accent {
      background: var(--brand-soft);
      color: var(--brand);
      font-weight: 600;
      border-color: rgba(15, 118, 110, 0.18);
    }

    .nav-pill-accent:hover {
      background: #ccfbf1;
      color: var(--brand-hover);
    }

    .cart-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 20px;
      height: 20px;
      padding: 0 6px;
      border-radius: var(--radius-pill);
      background: var(--brand);
      color: #fff;
      font-size: 0.75rem;
      font-weight: 700;
    }

    /* Category Bar */
    .category-strip {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
      scrollbar-width: none;
    }

    .category-strip::-webkit-scrollbar {
      display: none;
    }

    .category-strip-inner {
      max-width: 1240px;
      margin: 0 auto;
      padding: 0 20px;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .cat-pill {
      display: inline-flex;
      align-items: center;
      padding: 9px 14px;
      font-size: 0.84rem;
      font-weight: 500;
      color: var(--text-secondary);
      text-decoration: none;
      border-bottom: 2px solid transparent;
      transition: all 0.15s;
    }

    .cat-pill:hover {
      color: var(--brand);
      border-bottom-color: var(--brand);
    }

    /* Main Layout */
    .page-container {
      max-width: 1240px;
      margin: 28px auto;
      padding: 0 20px 64px;
    }

    .hero-banner {
      background: linear-gradient(125deg, #0f172a 0%, #134e4a 65%, #0f766e 100%);
      color: #fff;
      border-radius: var(--radius-lg);
      padding: 32px 28px;
      margin-bottom: 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 24px;
      flex-wrap: wrap;
      box-shadow: var(--shadow-md);
    }

    .hero-banner h1 {
      margin: 0 0 8px;
      font-size: 1.85rem;
      font-weight: 800;
      letter-spacing: -0.025em;
    }

    .hero-banner p {
      margin: 0;
      color: rgba(255, 255, 255, 0.84);
      max-width: 560px;
      font-size: 0.98rem;
    }

    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin: 24px 0 16px;
      gap: 12px;
      flex-wrap: wrap;
    }

    .section-title {
      margin: 0;
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    /* Product Grid & Cards */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(245px, 1fr));
      gap: 20px;
    }

    .product-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: var(--shadow-xs);
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
    }

    .product-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-md);
      border-color: var(--border-strong);
    }

    .product-img-wrap {
      display: block;
      aspect-ratio: 4 / 3;
      background: var(--surface-subtle);
      overflow: hidden;
    }

    .product-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.25s ease;
    }

    .product-card:hover .product-img-wrap img {
      transform: scale(1.03);
    }

    .product-card-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      flex: 1;
      justify-content: space-between;
      gap: 12px;
    }

    .product-title {
      margin: 4px 0 4px;
      font-size: 1rem;
      font-weight: 600;
      line-height: 1.35;
    }

    .product-title a {
      text-decoration: none;
      color: var(--text);
    }

    .product-title a:hover {
      color: var(--brand);
    }

    .store-label {
      font-size: 0.82rem;
      color: var(--muted);
    }

    .price-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding-top: 10px;
      border-top: 1px solid var(--surface-subtle);
    }

    .price-amd {
      font-size: 1.08rem;
      font-weight: 700;
      color: var(--text);
    }

    .rating-pill {
      font-size: 0.82rem;
      font-weight: 600;
      color: #b45309;
      background: var(--accent-soft);
      padding: 3px 8px;
      border-radius: var(--radius-pill);
    }

    /* Surfaces, Forms & Buttons */
    .surface {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 22px;
      margin-bottom: 18px;
      box-shadow: var(--shadow-xs);
    }

    .two-col {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 24px;
      align-items: start;
    }

    @media (max-width: 820px) {
      .two-col {
        grid-template-columns: 1fr;
      }
    }

    .form-grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    @media (max-width: 600px) {
      .form-grid-2 {
        grid-template-columns: 1fr;
      }
    }

    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    .field input,
    .field select,
    .field textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 0.94rem;
      color: var(--text);
      background: var(--surface);
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .field input:focus,
    .field select:focus,
    .field textarea:focus {
      outline: none;
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.14);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 16px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-strong);
      background: var(--surface);
      color: var(--text);
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn:hover:not(:disabled) {
      background: var(--surface-subtle);
      border-color: #94a3b8;
    }

    .btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--brand);
      border-color: var(--brand);
      color: #fff;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--brand-hover);
      border-color: var(--brand-hover);
    }

    .btn-light {
      background: #fff;
      border-color: #fff;
      color: var(--text);
    }

    .btn-light:hover:not(:disabled) {
      background: #f1f5f9;
    }

    .btn-danger {
      background: var(--danger);
      border-color: var(--danger);
      color: #fff;
    }

    .btn-danger:hover:not(:disabled) {
      background: #b91c1c;
    }

    .btn-sm {
      padding: 6px 11px;
      font-size: 0.82rem;
    }

    .notice {
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      margin-bottom: 16px;
      font-size: 0.9rem;
      font-weight: 500;
    }

    .notice-error {
      background: var(--danger-soft);
      color: #991b1b;
      border: 1px solid #fecaca;
    }

    .notice-warn {
      background: var(--accent-soft);
      color: #92400e;
      border: 1px solid #fde68a;
    }

    .notice-ok {
      background: var(--success-soft);
      color: #166534;
      border: 1px solid #bbf7d0;
    }

    .status-chip {
      display: inline-block;
      padding: 3px 10px;
      border-radius: var(--radius-pill);
      font-size: 0.76rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      background: var(--surface-subtle);
      color: var(--text-secondary);
    }

    .chip-placed { background: #e0f2fe; color: #0369a1; }
    .chip-confirmed { background: #fef3c7; color: #92400e; }
    .chip-shipped { background: #e0e7ff; color: #3730a3; }
    .chip-delivered { background: #dcfce7; color: #166534; }
    .chip-cancelled { background: #fee2e2; color: #991b1b; }

    .row-between {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .muted {
      color: var(--muted);
      font-size: 0.88rem;
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 22px;
    }

    .kpi-value {
      font-size: 1.55rem;
      font-weight: 800;
      margin-top: 6px;
      color: var(--text);
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }

    th {
      text-align: left;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
    }

    td {
      padding: 12px;
      border-bottom: 1px solid var(--surface-subtle);
      vertical-align: middle;
    }

    .gallery-main {
      width: 100%;
      height: 380px;
      object-fit: contain;
      background: var(--surface-subtle);
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
    }

    .gallery-thumbs {
      display: flex;
      gap: 10px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    .gallery-thumbs img {
      width: 68px;
      height: 68px;
      object-fit: cover;
      border-radius: var(--radius-sm);
      border: 2px solid var(--border);
      cursor: pointer;
      transition: border-color 0.15s;
    }

    .gallery-thumbs img:hover {
      border-color: var(--brand);
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-container">
      <a href="/" class="brand-logo" data-link>
        <span class="brand-mark">Շ</span>
        <span>Shuka<span class="tld">.am</span></span>
      </a>
      <form class="search-form" id="globalSearchForm">
        <input type="text" id="globalSearchInput" placeholder="Search products in Armenia..." aria-label="Search products" />
        <button type="submit">Search</button>
      </form>
      <nav class="nav-group" id="navActions"></nav>
    </div>
    <div class="category-strip">
      <div class="category-strip-inner" id="catBar"></div>
    </div>
  </header>

  <main class="page-container" id="app"></main>
  <script src="/app.js"></script>
</body>
</html>
